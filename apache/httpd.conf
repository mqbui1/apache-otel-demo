LoadModule lua_module modules/mod_lua.so

LuaPackagePath "/usr/local/apache2/otel/?.lua;;"
LuaHookFixups /usr/local/apache2/otel/otel.lua trace_request

ServerName localhost

Listen 80

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    AllowOverride None
    Require all granted
</Directory>

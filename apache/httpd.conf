ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

LoadModule opentelemetry_module modules/mod_opentelemetry.so

Listen 80

<VirtualHost *:80>

    ProxyPass / http://app:5000/
    ProxyPassReverse / http://app:5000/

    OpenTelemetryEnabled On

    OpenTelemetryExporter otlp

    OpenTelemetryEndpoint http://otel-collector:4318/v1/traces

    OpenTelemetryServiceName apache-httpd

</VirtualHost>

services:
  apache:
    build:
      context: ./apache
    container_name: apache
    ports:
      - "8080:80"
    depends_on:
      - app
      - otel-collector

  app:
    build:
      context: ./app
    container_name: app
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
    ports:
      - "5000:5000"

  otel-collector:
    image: signalfx/splunk-otel-collector:0.145.0
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      SPLUNK_ACCESS_TOKEN: ${SPLUNK_ACCESS_TOKEN}
      SPLUNK_REALM: "us1"
    command: ["--config=/etc/otel-collector-config.yaml"]

version: "3.8"

services:

apache:
build:
context: ./apache
dockerfile: Dockerfile
container_name: apache
ports:
- "8080:80"
depends_on:
- app
- otel-collector

app:
build:
context: ./app
dockerfile: Dockerfile.app
container_name: app
environment:
OTEL_EXPORTER_OTLP_ENDPOINT: "[http://otel-collector:4318](http://otel-collector:4318)"
OTEL_SERVICE_NAME: "flask"
OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
ports:
- "5000:5000"

otel-collector:
image: "quay.io/signalfx/splun

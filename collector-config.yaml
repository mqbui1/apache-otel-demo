receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  otlphttp/splunk:
    endpoint: https://ingest.us1.signalfx.com/v2/trace
    headers:
      X-SF-TOKEN: ${SPLUNK_ACCESS_TOKEN}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/splunk]
